apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-management-app

  template:
    metadata:
      labels:
        app: student-management-app

    spec:
      containers:
        - name: student-management-app
          image: sugamkuma567/student-management-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8082

---
apiVersion: v1
kind: Service
metadata:
  name: student-management-service

spec:
  type: NodePort

  selector:
    app: student-management-app

  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
      protocol: TCP